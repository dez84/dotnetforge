# DotNetForge — full production stack (DB + API + web).
#
#   POSTGRES_PASSWORD=... JWT_SECRET=... docker compose -f docker-compose.prod.yml up -d --build
#
# All three services run on one network; only the web frontend is published.
# Put a TLS-terminating reverse proxy (Caddy, Traefik, nginx, or the platform
# edge) in front of port 3000 in real deployments.

services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-dotnetforge}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB:-dotnetforge}
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./database/schema.sql:/docker-entrypoint-initdb.d/01-schema.sql:ro
      - ./database/seed.sql:/docker-entrypoint-initdb.d/02-seed.sql:ro
      - ./database/init/03-prod-hardening.sql:/docker-entrypoint-initdb.d/03-prod-hardening.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 5s
      timeout: 5s
      retries: 10
    # Not published — reachable only by api/web on the internal network.
    expose:
      - "5432"

  api:
    build:
      context: .
      dockerfile: backend/Dockerfile
    restart: unless-stopped
    environment:
      NODE_ENV: production
      PORT: 4000
      DATABASE_URL: postgres://${POSTGRES_USER:-dotnetforge}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB:-dotnetforge}
      JWT_SECRET: ${JWT_SECRET:?set JWT_SECRET}
    depends_on:
      db:
        condition: service_healthy
    expose:
      - "4000"

  web:
    build:
      context: .
      dockerfile: frontend/Dockerfile
      args:
        API_PROXY_TARGET: http://api:4000
    restart: unless-stopped
    environment:
      NODE_ENV: production
      PORT: 3000
      API_PROXY_TARGET: http://api:4000
    depends_on:
      api:
        condition: service_healthy
    ports:
      - "${WEB_PORT:-3000}:3000"

volumes:
  pgdata:
    name: ${PG_VOLUME:-dotnetforge_pgdata}
