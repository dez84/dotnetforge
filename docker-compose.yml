services:
  postgres:
    image: postgres:16-alpine
    container_name: dotnetforge-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: dotnetforge
      POSTGRES_PASSWORD: dotnetforge
      POSTGRES_DB: dotnetforge
    ports:
      - "5432:5432"
    volumes:
      - dotnetforge_pgdata:/var/lib/postgresql/data
      - ./database/schema.sql:/docker-entrypoint-initdb.d/01-schema.sql:ro
      - ./database/seed.sql:/docker-entrypoint-initdb.d/02-seed.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U dotnetforge -d dotnetforge"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  dotnetforge_pgdata:
